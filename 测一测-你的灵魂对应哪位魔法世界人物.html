<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>测一测|你的灵魂对应哪位魔法世界人物</title>
<style>
/* ============ 1. 设计变量：夜空 / 烛火 / 羊皮纸 ============ */
:root{
  --canvas:#0B1220;          /* 夜空底：蓝黑，不纯黑 */
  --canvas-2:#090F1A;
  --world:#16324A;           /* 远处城堡的蓝瓦 */
  --accent:#E7B25F;          /* 烛火金：只给进度、选中、蜡封 */
  --accent-deep:#B67F33;
  --mint:#8FB6A6;            /* 魔药瓶里的淡绿，只在次要信息出现一次 */
  --ink:#F0E7D6;             /* 暖白，不用纯白 */
  --ink-2:#9EACBE;
  --parch:#EFE4CC;           /* 羊皮纸 */
  --parch-2:#E3D5B8;
  --ink-p:#1C2531;           /* 纸上的墨 */
  --ink-p2:#6B6350;

  --r-shell:30px;
  --r-card:18px;
  --r-ctl:10px;
  --r-pill:999px;

  --sh-card: 0 1px 2px rgba(9,15,26,.28), 0 10px 26px -10px rgba(9,15,26,.55), 0 30px 70px -30px rgba(9,15,26,.7);
  --sh-phone: 0 0 0 1px rgba(231,178,95,.14), 0 2px 4px rgba(0,0,0,.4), 0 40px 90px -20px rgba(0,0,0,.85);
  --sh-gold: 0 8px 24px -10px rgba(231,178,95,.55);

  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;

  --ease:cubic-bezier(.22,.75,.3,1);
  --hud:84px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--canvas-2);color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* ============ 2. 桌面：手机取景框 + 魔法世界的夜空台面 ============ */
.stage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(231,178,95,.13), transparent 62%),
    radial-gradient(80% 60% at 90% 100%, rgba(143,182,166,.10), transparent 70%),
    linear-gradient(180deg,#0C1524 0%,#080D16 60%,#06090F 100%);
  overflow:hidden;
}
/* 远山的城堡剪影：一层造型，不是装饰噪音 */
.castle{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);
  width:min(1200px,150vw);opacity:.42;pointer-events:none}

/* ============ 3. 手机面板（手机上就是全屏） ============ */
.phone{
  position:relative;width:min(100vw,468px);height:min(100dvh,884px);
  background:linear-gradient(180deg,#0E1826 0%,#0A111C 62%,#0C1522 100%);
  border-radius:var(--r-shell);box-shadow:var(--sh-phone);
  overflow:hidden;display:flex;flex-direction:column;isolation:isolate;
}
@media(max-width:640px){
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .castle{opacity:.3}
}
/* 顶部光晕 + 星点：一层 sky 铺满，全站共用 */
.sky{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(72% 40% at 50% -6%, rgba(231,178,95,.20), transparent 70%),
    radial-gradient(40% 30% at 88% 12%, rgba(143,182,166,.09), transparent 70%);
}
.sky::before{
  content:"";position:absolute;inset:0;opacity:.55;
  background:
    radial-gradient(1.4px 1.4px at 12% 16%,rgba(240,231,214,.85),transparent 65%),
    radial-gradient(1.2px 1.2px at 78% 11%,rgba(240,231,214,.7),transparent 65%),
    radial-gradient(1.6px 1.6px at 32% 9%,rgba(231,178,95,.8),transparent 65%),
    radial-gradient(1px 1px at 62% 24%,rgba(240,231,214,.65),transparent 65%),
    radial-gradient(1.5px 1.5px at 88% 34%,rgba(240,231,214,.6),transparent 65%),
    radial-gradient(1.2px 1.2px at 22% 38%,rgba(240,231,214,.55),transparent 65%),
    radial-gradient(1.8px 1.8px at 46% 6%,rgba(240,231,214,.75),transparent 65%),
    radial-gradient(1px 1px at 70% 44%,rgba(143,182,166,.6),transparent 65%),
    radial-gradient(1.3px 1.3px at 8% 52%,rgba(240,231,214,.4),transparent 65%),
    radial-gradient(1.1px 1.1px at 94% 58%,rgba(240,231,214,.35),transparent 65%);
  animation:twinkle 9s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.35}to{opacity:.7}}

/* ============ 4. 顶部状态条 ============ */
.hud{
  position:relative;z-index:40;flex:none;
  padding:calc(env(safe-area-inset-top) + 16px) 20px 0;
  min-height:var(--hud);
}
.hud-row{display:flex;align-items:center;gap:10px;height:26px}
.hud-tag{font-size:11.5px;letter-spacing:.14em;color:var(--mint);font-weight:600;text-transform:uppercase}
.hud-count{margin-left:auto;font-size:12px;letter-spacing:.06em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hud-count b{color:var(--ink);font-weight:700}
.bar{margin-top:12px;height:3px;border-radius:3px;background:rgba(240,231,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--accent-deep),var(--accent));
  box-shadow:0 0 14px rgba(231,178,95,.7);transition:width .5s var(--ease)}
.back{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);
  padding:4px 8px 4px 0;border-radius:var(--r-ctl);opacity:0;pointer-events:none;transition:opacity .3s}
.back.on{opacity:1;pointer-events:auto}
.back:active{color:var(--accent)}
.back svg{width:13px;height:13px}

/* ============ 5. 屏幕容器 ============ */
.screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.pad{padding:0 22px calc(env(safe-area-inset-bottom) + 22px)}

/* ============ 6. 启动页 ============ */
#intro{padding-top:calc(var(--hud) + 4px);justify-content:center;overflow-y:auto}
.crest{width:74px;height:88px;margin:0 auto 22px;position:relative}
.crest svg{width:100%;height:100%}
.eyebrow{text-align:center;font-size:11.5px;letter-spacing:.22em;color:var(--accent);
  text-transform:uppercase;margin-bottom:14px}
#intro h1{
  font-family:var(--serif);font-size:clamp(29px,8.6vw,40px);line-height:1.36;
  text-align:center;letter-spacing:.01em;color:var(--ink);font-weight:700;
  text-wrap:balance;
}
#intro h1 .pipe{color:var(--accent);margin:0 .12em}
.lead{max-width:23em;margin:20px auto 0;text-align:center;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.lead em{font-style:normal;color:var(--ink)}
.rules{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.rules span{font-size:11.5px;color:var(--ink-2);padding:6px 11px;border-radius:var(--r-pill);
  background:rgba(240,231,214,.055);border:1px solid rgba(240,231,214,.09)}
.start-wrap{margin-top:32px;padding:0 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:54px;border-radius:var(--r-pill);font-size:16px;font-weight:700;
  transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,#F0C176,#E7B25F 55%,#D29441);color:#20180A;
  box-shadow:var(--sh-gold),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-ghost{background:rgba(240,231,214,.07);color:var(--ink);border:1px solid rgba(240,231,214,.16)}
.btn-dark{background:#141F2E;color:var(--parch);border:1px solid rgba(240,231,214,.14)}
.btn svg{width:17px;height:17px}
.foot{margin-top:18px;text-align:center;font-size:10.5px;line-height:1.7;color:rgba(158,172,190,.7);padding:0 10px}

/* ============ 7. 答题页 ============ */
#quiz{padding-top:calc(var(--hud) + 2px)}
.qwrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 22px calc(env(safe-area-inset-bottom) + 20px)}
/* 巨大的题号水印：填空，而不是拿装饰去填 */
.qwm{position:absolute;right:14px;top:16px;z-index:0;font-family:var(--serif);
  font-size:96px;line-height:.8;color:rgba(231,178,95,.08);pointer-events:none;letter-spacing:-.02em}
@keyframes qin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.qwrap.in{animation:qin .38s var(--ease) both}
.qnum{font-family:var(--serif);font-size:13px;letter-spacing:.1em;color:var(--accent)}
.qtext{font-family:var(--serif);font-size:clamp(21px,5.6vw,26px);line-height:1.5;
  color:var(--ink);margin:14px 0 26px;font-weight:700;text-wrap:pretty}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;
  padding:15px 16px;min-height:58px;border-radius:var(--r-card);font-size:14.5px;line-height:1.6;
  color:#D5DFEB;background:rgba(240,231,214,.045);
  border:1px solid rgba(240,231,214,.10);
  transition:background .22s,border-color .22s,transform .16s,color .22s,opacity .25s}
.opt .k{flex:none;width:23px;height:23px;border-radius:50%;
  border:1px solid rgba(240,231,214,.26);color:var(--ink-2);
  display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  transition:all .22s}
.opt .ck{flex:none;margin-left:auto;width:17px;height:17px;opacity:0;transform:scale(.7);
  transition:all .22s}
.opt:active{transform:scale(.985);background:rgba(240,231,214,.09)}
.opt.sel{background:rgba(231,178,95,.13);border-color:rgba(231,178,95,.62);color:#FFF6E4;
  box-shadow:0 0 0 1px rgba(231,178,95,.22) inset,0 12px 30px -16px rgba(231,178,95,.6)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#20180A}
.opt.sel .ck{opacity:1;transform:scale(1)}
.opt.fade{opacity:.42}
.qhint{margin-top:16px;font-size:11.5px;color:rgba(158,172,190,.65);text-align:center;letter-spacing:.02em}

/* ============ 8. 分院帽思考页 ============ */
#think{align-items:center;justify-content:center;text-align:center;padding:0 30px}
.ring{width:132px;height:132px;position:relative;margin-bottom:30px}
.ring svg{width:100%;height:100%}
.ring .spin{animation:spin 14s linear infinite}
.ring .pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.think-title{font-family:var(--serif);font-size:22px;letter-spacing:.04em;color:var(--ink)}
.think-line{margin-top:12px;font-size:13.5px;color:var(--ink-2);height:20px;transition:opacity .3s}
.think-line.hide{opacity:0}
.dots{display:flex;gap:6px;justify-content:center;margin-top:26px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.3;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.25}45%{opacity:1}}

/* ============ 9. 结果页 ============ */
#result{padding-top:calc(var(--hud) + 2px);overflow:hidden}
.result-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(env(safe-area-inset-bottom) + 24px);scrollbar-width:none}
.result-scroll::-webkit-scrollbar{display:none}
.rcard{
  position:relative;background:linear-gradient(170deg,var(--parch) 0%,var(--parch-2) 100%);
  color:var(--ink-p);border-radius:22px;padding:22px 20px 20px;
  box-shadow:var(--sh-card);overflow:hidden;
}
/* 纸纹：极淡的横纹 + 边缘压暗，不用噪点图 */
.rcard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-linear-gradient(0deg,rgba(107,99,80,.055) 0 1px,transparent 1px 4px),
    radial-gradient(90% 62% at 50% 0%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(120% 90% at 50% 118%,rgba(120,100,64,.22),transparent 60%)}
.rcard>*{position:relative;z-index:1}
.r-top{display:flex;align-items:flex-start;gap:12px}
.r-top .r-pct{margin-left:auto}
.r-kicker{font-size:10.5px;letter-spacing:.2em;color:var(--ink-p2);text-transform:uppercase}
.r-name{font-family:var(--serif);font-size:clamp(27px,7.4vw,33px);line-height:1.24;
  margin-top:10px;letter-spacing:.01em;font-weight:700;overflow-wrap:anywhere}
.r-tag{font-size:12px;color:var(--ink-p2);margin-top:7px;letter-spacing:.04em;line-height:1.5}
.r-pct{flex:none;text-align:right;display:flex;align-items:baseline;gap:4px}
.r-pct b{font-family:var(--serif);font-size:27px;line-height:1;letter-spacing:-.02em}
.r-pct span{font-size:10px;letter-spacing:.1em;color:var(--ink-p2)}
.r-rule{height:1px;background:rgba(28,37,49,.15);margin:18px 0 16px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;
  color:var(--ink-p2);text-transform:uppercase;margin-bottom:9px}
.sec-h::after{content:"";flex:1;height:1px;background:rgba(28,37,49,.14)}
.sec-p{font-size:14.5px;line-height:1.85;color:#26303C}
.sec-p + .sec-h{margin-top:20px}
.egg{background:rgba(28,37,49,.055);border-radius:14px;padding:14px;margin-top:2px;
  font-size:13.5px;line-height:1.8;color:#33404E;border:1px solid rgba(28,37,49,.08)}
.egg b{color:var(--accent-deep)}

/* 六维：结果页自己的指纹，方便截图 */
.dims{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;margin-top:14px}
.dim{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-p2)}
.dim .n{width:2.1em;flex:none}
.dim .t{flex:1;height:3px;border-radius:3px;background:rgba(28,37,49,.14);overflow:hidden}
.dim .t i{display:block;height:100%;width:0;background:var(--world);border-radius:3px;
  transition:width 1s var(--ease)}
.dim b{font-variant-numeric:tabular-nums;color:var(--ink-p);font-weight:700;font-size:11px;width:2.2em;text-align:right}

/* 别人的影子：第二名 */
.runner{margin-top:14px;font-size:12px;color:var(--ink-p2);line-height:1.7}
.runner b{color:var(--ink-p);font-weight:700}

/* slogan 块 */
.slogan{margin-top:18px;background:#14202E;border-radius:16px;padding:16px 16px 14px;color:var(--parch)}
.slogan .q{font-family:var(--serif);font-size:17px;line-height:1.6;letter-spacing:.01em}
.slogan .q::before{content:"“";color:var(--accent);font-size:22px;margin-right:2px}
.slogan .q::after{content:"”";color:var(--accent);font-size:22px}
.slogan .row{display:flex;align-items:center;gap:8px;margin-top:12px}
.slogan .row span{font-size:10.5px;letter-spacing:.14em;color:rgba(239,228,204,.5);text-transform:uppercase}
.copy{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;
  padding:6px 12px;border-radius:var(--r-pill);background:rgba(231,178,95,.16);
  color:var(--accent);border:1px solid rgba(231,178,95,.32)}
.copy:active{background:rgba(231,178,95,.28)}
.copy svg{width:12px;height:12px}
.stamp{position:absolute;right:-16px;top:-16px;width:104px;height:104px;opacity:.12;
  pointer-events:none;z-index:0!important}
.acts{display:grid;gap:10px;margin-top:14px}
.disclaimer{margin-top:14px;font-size:10.5px;line-height:1.7;text-align:center;color:rgba(158,172,190,.62)}

/* 结果入场 */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim{animation:up .6s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}.d4{animation-delay:.3s}

/* toast */
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);
  transform:translate(-50%,14px);z-index:80;opacity:0;pointer-events:none;
  background:rgba(20,31,46,.96);color:var(--parch);font-size:13px;
  padding:11px 18px;border-radius:var(--r-pill);border:1px solid rgba(231,178,95,.28);
  transition:all .35s var(--ease);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-height:720px){
  .crest{width:58px;height:70px;margin-bottom:14px}
  #intro h1{font-size:clamp(25px,8.4vw,32px)}
  .lead{margin-top:14px;font-size:13.5px;line-height:1.78}
  .rules{margin-top:16px}
  .start-wrap{margin-top:24px}
  .foot{margin-top:12px}
  .qtext{margin:10px 0 18px}
  .opt{padding:13px 15px;min-height:52px;font-size:14px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="stage">
  <!-- 远处城堡：一层剪影，给桌面一点世界感 -->
  <svg class="castle" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#16324A"/><stop offset="1" stop-color="#0A111C"/>
      </linearGradient>
    </defs>
    <g fill="url(#cg)">
      <rect x="0" y="196" width="1200" height="64"/>
      <path d="M120 196V120l10-26 10 26v76zM160 196V96l10-24 10 24v100zM88 196V140l8-20 8 20v56z"/>
      <rect x="128" y="132" width="28" height="64"/><rect x="196" y="150" width="40" height="46"/>
      <path d="M470 196V70l14-34 14 34v126zM512 196V52l16-36 16 36v144zM548 196V92l12-28 12 28v104z"/>
      <rect x="462" y="120" width="112" height="76"/>
      <path d="M700 196V128l10-24 10 24v68zM740 196V104l12-28 12 28v92z"/>
      <path d="M880 196V84l14-32 14 32v112zM918 196V118l10-22 10 22v78z"/>
      <rect x="990" y="150" width="120" height="46"/><rect x="1020" y="128" width="60" height="68"/>
      <path d="M1030 128V100l10-22 10 22v28zM1060 128V96l8-20 8 20v32z"/>
    </g>
  </svg>

  <div class="phone">
    <div class="sky"></div>

    <!-- 顶部进度条 -->
    <div class="hud">
      <div class="hud-row">
        <button class="back" id="backBtn" aria-label="上一题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          上一题
        </button>
        <span class="hud-tag" id="hudTag">霍格沃茨 · 分院帽</span>
        <span class="hud-count" id="hudCount"></span>
      </div>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    </div>

    <!-- 启动页 -->
    <section class="screen on" id="intro">
      <div class="pad" style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <div class="crest">
          <svg viewBox="0 0 74 88" fill="none" aria-hidden="true">
            <path d="M37 2 70 14v34c0 20-14 32-33 38-19-6-33-18-33-38V14z"
                  stroke="#E7B25F" stroke-width="1.6" fill="rgba(231,178,95,.06)"/>
            <path d="M37 10 63 19v28c0 15-11 25-26 30-15-5-26-15-26-30V19z"
                  stroke="rgba(240,231,214,.22)" stroke-width="1"/>
            <!-- 烛火 -->
            <path d="M37 30c4 4 6 7 6 11 0 4.2-2.7 7-6 7s-6-2.8-6-7c0-4 2-7 6-11z" fill="#E7B25F" opacity=".9"/>
            <path d="M37 38c1.6 2 2.4 3.4 2.4 5.2 0 2-1 3.4-2.4 3.4s-2.4-1.4-2.4-3.4c0-1.8.8-3.2 2.4-5.2z" fill="#FFF6E4"/>
            <rect x="35.4" y="46" width="3.2" height="14" rx="1.6" fill="rgba(240,231,214,.5)"/>
            <path d="M37 66l1.8 4.6 4.8.3-3.7 3.1 1.2 4.7-4.1-2.7-4.1 2.7 1.2-4.7-3.7-3.1 4.8-.3z" fill="#E7B25F" opacity=".8"/>
          </svg>

/* ============================================================
   评分：每个维度的实际得分 / 该维度最高可得，得到 0–1 的画像
   再用「去均值后求余弦」匹配人物，避免大家都像同一个人
   ============================================================ */
const MAXP = [0,0,0,0,0,0];
QUESTIONS.forEach(q=>{
  for(let d=0;d<6;d++){
    MAXP[d] += Math.max.apply(null, q.o.map(op=>op.w[d]));
  }
});
function profileOf(ans){
  const sum=[0,0,0,0,0,0];
  ans.forEach((pick,qi)=>{
    if(pick==null) return;
    QUESTIONS[qi].o[pick].w.forEach((n,d)=>sum[d]+=n);
  });
  return sum.map((v,d)=> MAXP[d] ? v/MAXP[d] : 0);
}
function center(v){
  const m = v.reduce((a,b)=>a+b,0)/v.length;
  const c = v.map(x=>x-m);
  const len = Math.sqrt(c.reduce((a,b)=>a+b*b,0)) || 1;
  return c.map(x=>x/len);
}
function matchAll(p){
  const pc = center(p);
  return CHARS.map(ch=>{
    const cc = center(ch.v);
    const r = pc.reduce((a,b,i)=>a+b*cc[i],0);
    return {ch, r, pct: Math.max(36, Math.min(99, Math.round(50 + 50*r)))};
  }).sort((a,b)=>b.r-a.r);
}
/* 首位至少 87%，避免出现「你的灵魂只对上了 66%」这种扫兴文案 */
function pctText(n){ return n + "%"; }

   ============================================================ */
const el = id => document.getElementById(id);
const screens = {intro:el("intro"), quiz:el("quiz"), think:el("think"), result:el("result")};
let idx = 0;            // 当前第几题
let answers = [];       // 已选答案，可回看可改
let locked = false;
let finalTop = null;

function show(name){
  Object.keys(screens).forEach(k=>screens[k].classList.toggle("on", k===name));
}
function updateHud(){
  const answered = answers.filter(a=>a!=null).length;
  if(screens.intro.classList.contains("on")){
    el("hudCount").textContent = "40 题";
    el("barFill").style.width = "0";
    el("backBtn").classList.remove("on");
    return;
  }
  el("hudCount").innerHTML = `<b>${String(Math.min(answered,40)).padStart(2,"0")}</b> / 40`;
  el("barFill").style.width = (answered/40*100) + "%";
  el("backBtn").classList.toggle("on", screens.quiz.classList.contains("on") && idx>0);
}

/* 渲染一道题 */
function renderQ(){
  const q = QUESTIONS[idx];
  const wrap = el("qwrap");
  const saved = answers[idx];
  wrap.className = "qwrap";
  wrap.innerHTML = `
    <span class="qwm" aria-hidden="true">${String(idx+1).padStart(2,"0")}</span>
    <p class="qnum">第 ${String(idx+1).padStart(2,"0")} 题</p>
    <h2 class="qtext">${q.q}</h2>
    <div class="opts" id="opts">
      ${q.o.map((op,i)=>`
        <button class="opt${saved===i?" sel":""}" data-i="${i}">
          <span class="k">${"ABCD"[i]}</span>
          <span>${op.t}</span>
          <svg class="ck" viewBox="0 0 24 24" fill="none" stroke="#E7B25F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
        </button>`).join("")}
    </div>
    <p class="qhint">选第一感觉，不要想太多</p>
  `;
  void wrap.offsetWidth;       // 触发一次重排，让入场动画重新播
  wrap.classList.add("in");
  wrap.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>choose(Number(btn.dataset.i)));
  });
  el("hudTag").textContent = "霍格沃茨 · 分院帽";
  updateHud();
}

function choose(i){
  if(locked) return;
  locked = true;
  const opts = el("opts").querySelectorAll(".opt");
  opts.forEach((b,k)=>{
    b.classList.toggle("sel", k===i);
    if(k!==i) b.classList.add("fade");
  });
  answers[idx] = i;
  updateHud();
  setTimeout(()=>{
    locked = false;
    if(idx >= QUESTIONS.length-1){ startThink(); }
    else { idx++; renderQ(); }
  }, 340);
}

  "它正在翻阅那份很长的名单……",
  "嗯……有点难分。",
  "勇气、温度、还有一点不合规矩。",
  "它把帽子放下来了。"
];
function startThink(){
  show("think");
  el("hudTag").textContent = "分院帽 · 正在判断";
  el("hudCount").innerHTML = `<b>40</b> / 40`;
  el("barFill").style.width = "100%";
  el("backBtn").classList.remove("on");
  finalTop = matchAll(profileOf(answers));
  let k = 0;
  const line = el("thinkLine");
  line.textContent = THINK_LINES[0];
  const timer = setInterval(()=>{
    k++;
    if(k < THINK_LINES.length){
      line.classList.add("hide");
      setTimeout(()=>{ line.textContent = THINK_LINES[k]; line.classList.remove("hide"); }, 220);
    }else{
      clearInterval(timer);
      setTimeout(renderResult, 700);
    }
  }, 620);
}

  const topPct = Math.max(87, top.pct);

  el("resultScroll").innerHTML = `
    <article class="rcard anim">
      <div class="r-top">
        <p class="r-kicker">分院帽的结论</p>
        <div class="r-pct"><b>${topPct}</b><span>% 契合</span></div>
      </div>
      <h2 class="r-name">${ch.name}</h2>
      <p class="r-tag">${ch.tag}</p>

      <div class="r-rule"></div>

      <div class="sec-h">为什么是你</div>
      <p class="sec-p">${ch.why}</p>

      <div class="sec-h">隐藏特质 & 小彩蛋</div>
      <div class="egg"><b>彩蛋 ·</b> ${ch.egg}</div>

      <div class="dims">
        ${dims.map(d=>`
          <div class="dim"><span class="n">${d.n}</span>
            <span class="t"><i data-w="${d.v}"></i></span><b>${d.v}</b></div>`).join("")}
      </div>

      <p class="runner">帽子在你身上还看见了 <b>${runner.ch.name}</b> 和 <b>${third.ch.name}</b> 的影子——
        你不是他们中的任何一个，但你确实借了他们一点东西。</p>

      <div class="slogan">
        <p class="q">${ch.s}</p>
        <div class="row">
          <span>Share this line</span>
          <button class="copy" id="copyBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            复制这句
          </button>
        </div>
      </div>

      <!-- 蜡封：结果卡的落款 -->
      <svg class="stamp" viewBox="0 0 92 92" aria-hidden="true">
        <circle cx="46" cy="46" r="42" fill="none" stroke="#8A6A3A" stroke-width="2"/>
        <circle cx="46" cy="46" r="33" fill="none" stroke="#8A6A3A" stroke-width="1"/>
        <path d="M46 24l6 14 15 1-11 10 3 15-13-8-13 8 3-15-11-10 15-1z" fill="#8A6A3A" opacity=".8"/>
      </svg>
    </article>

    <div class="acts anim d2">
      <button class="btn btn-primary" id="againBtn">重新测一次</button>
      <button class="btn btn-ghost" id="shareBtn">复制整段结果，发给朋友</button>
    </div>
    <p class="disclaimer">结果来自 40 题的性格画像，仅供娱乐。人和帽子都会变，明天重测可能是另一个人。</p>
  `;

  // 六维条：下一帧再填，才有生长感
  requestAnimationFrame(()=>{
    el("resultScroll").querySelectorAll(".dim .t i").forEach(bar=>{
      bar.style.width = bar.dataset.w + "%";
    });
  });

  el("copyBtn").addEventListener("click", ()=>copyText(`「${ch.name}」— ${ch.s}`));
  el("shareBtn").addEventListener("click", ()=>copyText(
    `我测出来是「${ch.name}」，契合度 ${topPct}%。\n「${ch.s}」\n你也来测测：测一测|你的灵魂对应哪位魔法世界人物`
  ));
  el("againBtn").addEventListener("click", reset);
  el("resultScroll").scrollTop = 0;

  show("result");
  el("hudTag").textContent = "分院帽 · 已分完";
  updateHud();
  el("backBtn").classList.remove("on");
}

/* 复制（含降级方案） */
function copyText(text){
  const done = ()=>toast("已复制，去粘贴吧");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy") ? done() : toast("长按手动复制吧"); }
  catch(e){ toast("长按手动复制吧"); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg){
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("on"), 1800);
}

/* 重测 */
function reset(){
  idx = 0; answers = []; locked = false; finalTop = null;
  el("barFill").style.width = "0";
  show("quiz");
  renderQ();
}

/* 按钮 */
el("startBtn").addEventListener("click", ()=>{
  idx = 0; answers = [];
  show("quiz");
  renderQ();
});
el("backBtn").addEventListener("click", ()=>{
  if(idx > 0 && !locked){
    idx--;
    renderQ();
  }
});
updateHud();
</script>
